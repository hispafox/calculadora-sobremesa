<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-texto="titulo">Calculadora</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e4dc;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Carcasa de plástico */
    .calculadora {
      width: 300px;
      padding: 22px 20px 24px;
      border-radius: 20px;
      background: linear-gradient(#ddd7c9, #c6bfaf);
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 0.25),
        inset 0 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    }

    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .marca {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #4b4740;
    }

    .marca small {
      display: block;
      font-size: 9px;
      font-weight: normal;
      letter-spacing: 1px;
      color: #6d685e;
    }

    /* Placa solar decorativa */
    .placa-solar {
      width: 96px;
      height: 26px;
      border: 2px solid #9a9384;
      border-radius: 3px;
      background: repeating-linear-gradient(90deg, #3b2c26 0 21px, #6b5548 21px 23px);
    }

    /* Pantalla LCD */
    .marco-pantalla {
      margin-bottom: 18px;
      padding: 10px;
      border-radius: 8px;
      background: #4d4c49;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .pantalla {
      height: 64px;
      padding: 0 10px;
      border-radius: 4px;
      background: linear-gradient(#c8d3a8, #b4c096);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.35);
      color: #0e120a;
      font-family: "Lucida Console", Consolas, "Courier New", monospace;
      font-size: 40px;
      line-height: 64px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Teclado */
    .teclado {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 50px;
      gap: 10px;
    }

    .teclado button {
      --cara: #2a2b2f;
      --borde: #111214;
      border: none;
      border-radius: 8px;
      background: linear-gradient(rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.08)), var(--cara);
      box-shadow: 0 4px 0 var(--borde), 0 6px 8px rgba(0, 0, 0, 0.25);
      color: #f4f4f2;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* La tecla se hunde al pulsarla, con el ratón o con el teclado del ordenador */
    .teclado button:active,
    .teclado button.pulsada {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--borde), 0 2px 3px rgba(0, 0, 0, 0.25);
    }

    .teclado .operacion { --cara: #2f5d9e; --borde: #1b3a66; }
    .teclado .borrar    { --cara: #b8322a; --borde: #6e1a14; }
    .teclado .borrar[data-tecla="C"] { --cara: #c2187a; --borde: #7a0f4c; }
    .teclado .igual     { --cara: #f59a23; --borde: #a85a0e; color: #1d1d1d; }

    .ancho { grid-column: span 2; }
    .alto  { grid-row: span 2; }

    /* Botón del historial, en la cabecera junto a la placa solar; debajo, el selector de idioma */
    .cabecera-derecha {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      gap: 6px 10px;
    }

    /* Selector de idioma: letras impresas en el plástico; la elegida, en relieve oscuro */
    .idiomas {
      grid-column: 1 / -1;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 9px;
      color: #8a8476;
    }

    .idiomas button {
      padding: 2px 4px;
      border: none;
      border-radius: 3px;
      background: none;
      color: #6d685e;
      font-family: inherit;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .idiomas button[aria-pressed="true"] {
      background: #4b4740;
      color: #f4f2ea;
    }

    .boton-historial {
      width: 30px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: #2a2b2f;
      box-shadow: 0 3px 0 #111214;
      color: #f4f4f2;
      cursor: pointer;
    }

    .boton-historial:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111214;
    }

    /* Historial: tira de papel que tapa las teclas */
    .teclado { position: relative; }

    .historial {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fbf9f2;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      color: #1d1d1d;
    }

    .historial[hidden] { display: none; }

    .historial-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px dashed #b5ad9c;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .teclado .cerrar-historial {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #2a2b2f;
      box-shadow: none;
      font-size: 18px;
      line-height: 1;
    }

    .historial-lista {
      flex: 1;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      font-family: "Lucida Console", Consolas, "Courier New", monospace;
      font-size: 15px;
    }

    .historial-lista:empty { display: none; }

    .historial-lista li {
      padding: 8px 0;
      border-bottom: 1px dashed #d8d1c1;
      text-align: right;
    }

    .historial-vacio {
      margin: 16px 0 0;
      color: #5a5549;
      font-size: 14px;
      text-align: center;
    }

    /* Número de versión discreto, como grabado en el plástico */
    .version {
      margin-top: 14px;
      font-size: 9px;
      letter-spacing: 1px;
      text-align: right;
      color: #aaa392;
    }
  </style>
</head>
<body>
  <main class="calculadora">
    <div class="cabecera">
      <div class="marca">CALC-8<small data-texto="digitos">8 DÍGITOS</small></div>
      <div class="cabecera-derecha">
        <button class="boton-historial" id="boton-historial" aria-label="Ver historial" aria-expanded="false" title="Historial" data-etiqueta="verHistorial" data-titulo="historial">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="placa-solar" aria-hidden="true"></div>
        <div class="idiomas" role="group" aria-label="Idioma" data-etiqueta="idioma">
          <button data-idioma="es" lang="es" aria-label="Español" title="Español" aria-pressed="true">ES</button>
          <span aria-hidden="true">·</span>
          <button data-idioma="en" lang="en" aria-label="English" title="English" aria-pressed="false">EN</button>
          <span aria-hidden="true">·</span>
          <button data-idioma="fr" lang="fr" aria-label="Français" title="Français" aria-pressed="false">FR</button>
          <span aria-hidden="true">·</span>
          <button data-idioma="pt" lang="pt" aria-label="Português" title="Português" aria-pressed="false">PT</button>
        </div>
      </div>
    </div>

    <div class="marco-pantalla">
      <div class="pantalla" id="pantalla" aria-live="polite">0</div>
    </div>

    <div class="teclado">
      <button class="borrar ancho" data-tecla="C" aria-label="Borrar todo" data-etiqueta="borrarTodo">C</button>
      <button class="borrar" data-tecla="CE" aria-label="Borrar número" data-etiqueta="borrarNumero">CE</button>
      <button class="operacion" data-tecla="-" aria-label="Restar" data-etiqueta="restar">−</button>

      <button data-tecla="7">7</button>
      <button data-tecla="8">8</button>
      <button data-tecla="9">9</button>
      <button class="operacion alto" data-tecla="+" aria-label="Sumar" data-etiqueta="sumar">+</button>

      <button data-tecla="4">4</button>
      <button data-tecla="5">5</button>
      <button data-tecla="6">6</button>

      <button data-tecla="1">1</button>
      <button data-tecla="2">2</button>
      <button data-tecla="3">3</button>
      <button class="igual alto" data-tecla="=" aria-label="Igual" data-etiqueta="igual">=</button>

      <button class="ancho" data-tecla="0">0</button>
      <button data-tecla="." aria-label="Punto decimal" data-etiqueta="puntoDecimal">.</button>

      <!-- Historial: tapa las teclas mientras está abierto -->
      <section class="historial" id="historial" aria-label="Historial" data-etiqueta="historial" hidden>
        <div class="historial-titulo">
          <span data-texto="historial">Historial</span>
          <button class="cerrar-historial" id="cerrar-historial" aria-label="Cerrar historial" data-etiqueta="cerrarHistorial">×</button>
        </div>
        <ol class="historial-lista" id="historial-lista"></ol>
        <p class="historial-vacio" id="historial-vacio" data-texto="historialVacio">Todavía no hay operaciones.</p>
      </section>
    </div>

    <div class="version">v1.0</div>
  </main>

  <!-- Lógica de la calculadora: no toca la página. calculadora.test.js la lee de este bloque. -->
  <script id="logica">
    // Calculadora de sobremesa de 8 dígitos que solo suma y resta.
    // Recibe el estado y la tecla pulsada, y devuelve el estado nuevo.

    const MAX_DIGITOS = 8;
    const MAX_HISTORIAL = 20;
    const SIMBOLOS = { "+": "+", "-": "−" };

    function crearEstado() {
      return {
        pantalla: "0",      // lo que se ve en la pantalla
        acumulado: null,    // resultado guardado a la espera del siguiente número
        operador: null,     // "+" o "-" pendiente de aplicar
        escribiendo: false, // true mientras se teclea un número
        error: false,       // true cuando la pantalla muestra "E"
        cuenta: "",         // operación en curso tal como se lee: "5 + 3 − "
        historial: [],      // operaciones terminadas, la más reciente primero
      };
    }

    // Teclas: "0"–"9", ".", "+", "-", "=", "C" y "CE".
    function pulsar(estado, tecla) {
      if (tecla === "C") return { ...crearEstado(), historial: estado.historial };
      if (estado.error) return estado;
      if (/^[0-9]$/.test(tecla)) return pulsarDigito(estado, tecla);
      if (tecla === ".") return pulsarPunto(estado);
      if (tecla === "+" || tecla === "-") return pulsarOperador(estado, tecla);
      if (tecla === "=") return pulsarIgual(estado);
      if (tecla === "CE") return { ...estado, pantalla: "0", escribiendo: true };
      return estado;
    }

    function pulsarDigito(estado, digito) {
      if (!estado.escribiendo || estado.pantalla === "0") {
        return { ...estado, pantalla: digito, escribiendo: true };
      }
      if (contarDigitos(estado.pantalla) >= MAX_DIGITOS) return estado;
      return { ...estado, pantalla: estado.pantalla + digito };
    }

    function pulsarPunto(estado) {
      if (!estado.escribiendo) return { ...estado, pantalla: "0.", escribiendo: true };
      if (estado.pantalla.includes(".")) return estado;
      return { ...estado, pantalla: estado.pantalla + "." };
    }

    function pulsarOperador(estado, operador) {
      // Dos operadores seguidos: vale el último.
      if (estado.operador && !estado.escribiendo) {
        return { ...estado, operador, cuenta: estado.cuenta.slice(0, -2) + SIMBOLOS[operador] + " " };
      }
      const resuelto = resolver(estado);
      if (resuelto.error) return resuelto;
      const cuenta = estado.cuenta + numeroTecleado(estado) + " " + SIMBOLOS[operador] + " ";
      return { ...resuelto, acumulado: Number(resuelto.pantalla), operador, escribiendo: false, cuenta };
    }

    function pulsarIgual(estado) {
      const resuelto = resolver(estado);
      if (resuelto.error) return resuelto;
      // Solo se apunta en el historial si había una suma o una resta que hacer.
      const historial = estado.operador
        ? [estado.cuenta + numeroTecleado(estado) + " = " + resuelto.pantalla, ...estado.historial].slice(0, MAX_HISTORIAL)
        : estado.historial;
      return { ...resuelto, acumulado: null, operador: null, escribiendo: false, cuenta: "", historial };
    }

    // El número de la pantalla tal como se apunta en la cuenta: "3." se apunta "3".
    function numeroTecleado(estado) {
      return estado.pantalla.replace(/\.$/, "");
    }

    // Aplica la operación pendiente, si la hay, y deja el resultado en la pantalla.
    function resolver(estado) {
      if (!estado.operador) return estado;
      const numero = Number(estado.pantalla);
      const resultado = estado.operador === "+" ? estado.acumulado + numero : estado.acumulado - numero;
      const texto = formatear(resultado);
      if (texto === null) return { ...crearEstado(), historial: estado.historial, pantalla: "E", error: true };
      return { ...estado, pantalla: texto };
    }

    // Convierte un resultado en el texto de la pantalla: como mucho 8 cifras, sin ceros
    // sobrantes ni restos de coma flotante (0.1 + 0.2 muestra 0.3). Devuelve null si no cabe.
    function formatear(numero) {
      const cifrasEnteras = String(Math.trunc(Math.abs(numero))).length;
      if (cifrasEnteras > MAX_DIGITOS) return null;
      let texto = Math.abs(numero).toFixed(MAX_DIGITOS - cifrasEnteras);
      if (texto.includes(".")) texto = texto.replace(/0+$/, "").replace(/\.$/, "");
      if (contarDigitos(texto) > MAX_DIGITOS) return null; // al redondear puede ganar una cifra
      return numero < 0 && texto !== "0" ? "-" + texto : texto;
    }

    function contarDigitos(texto) {
      return texto.replace(/[^0-9]/g, "").length;
    }

    // Teclas del teclado del ordenador que equivalen a una tecla de la calculadora.
    // La coma es el punto decimal del teclado numérico en español.
    // La letra C también borra todo: hay navegadores (el de VS Code) que se quedan con Escape.
    const TECLAS_DEL_ORDENADOR = {
      ".": ".", ",": ".",
      "+": "+", "-": "-",
      "=": "=", "Enter": "=",
      "Escape": "C", "c": "C", "C": "C",
      "Backspace": "CE", "Delete": "CE",
    };

    // Recibe el nombre de una tecla del ordenador ("7", "Enter"...) y devuelve
    // la tecla de la calculadora que le corresponde, o null si no se usa.
    function traducirTecla(tecla) {
      if (/^[0-9]$/.test(tecla)) return tecla;
      return TECLAS_DEL_ORDENADOR[tecla] ?? null;
    }

    // Textos de la interfaz en cada idioma. Las teclas, la pantalla y el historial
    // se ven igual en todos.
    const IDIOMA_POR_DEFECTO = "es";
    const TEXTOS = {
      es: {
        titulo: "Calculadora",
        digitos: "8 DÍGITOS",
        idioma: "Idioma",
        verHistorial: "Ver historial",
        historial: "Historial",
        cerrarHistorial: "Cerrar historial",
        historialVacio: "Todavía no hay operaciones.",
        borrarTodo: "Borrar todo",
        borrarNumero: "Borrar número",
        restar: "Restar",
        sumar: "Sumar",
        igual: "Igual",
        puntoDecimal: "Punto decimal",
      },
      en: {
        titulo: "Calculator",
        digitos: "8 DIGITS",
        idioma: "Language",
        verHistorial: "Show history",
        historial: "History",
        cerrarHistorial: "Close history",
        historialVacio: "No calculations yet.",
        borrarTodo: "Clear all",
        borrarNumero: "Clear entry",
        restar: "Subtract",
        sumar: "Add",
        igual: "Equals",
        puntoDecimal: "Decimal point",
      },
      fr: {
        titulo: "Calculatrice",
        digitos: "8 CHIFFRES",
        idioma: "Langue",
        verHistorial: "Voir l’historique",
        historial: "Historique",
        cerrarHistorial: "Fermer l’historique",
        historialVacio: "Aucune opération pour l’instant.",
        borrarTodo: "Tout effacer",
        borrarNumero: "Effacer le nombre",
        restar: "Soustraire",
        sumar: "Additionner",
        igual: "Égal",
        puntoDecimal: "Point décimal",
      },
      pt: {
        titulo: "Calculadora",
        digitos: "8 DÍGITOS",
        idioma: "Idioma",
        verHistorial: "Ver histórico",
        historial: "Histórico",
        cerrarHistorial: "Fechar histórico",
        historialVacio: "Ainda não há operações.",
        borrarTodo: "Apagar tudo",
        borrarNumero: "Apagar número",
        restar: "Subtrair",
        sumar: "Somar",
        igual: "Igual",
        puntoDecimal: "Ponto decimal",
      },
    };

    // Decide en qué idioma sale la calculadora. Manda el guardado, si es uno de los
    // nuestros; si no, el del navegador ("fr-FR" → "fr"); y si tampoco, español.
    function elegirIdioma(guardado, idiomaDelNavegador) {
      if (Object.hasOwn(TEXTOS, guardado)) return guardado;
      const delNavegador = String(idiomaDelNavegador ?? "").split("-")[0].toLowerCase();
      return Object.hasOwn(TEXTOS, delNavegador) ? delNavegador : IDIOMA_POR_DEFECTO;
    }
  </script>

  <!-- Conexión de los botones con la lógica -->
  <script>
    let estado = crearEstado();
    const pantalla = document.getElementById("pantalla");

    const CLAVE_IDIOMA = "calculadora-idioma";
    let idioma = elegirIdioma(leerIdiomaGuardado(), navigator.language);

    const botonHistorial = document.getElementById("boton-historial");
    const historial = document.getElementById("historial");
    const listaHistorial = document.getElementById("historial-lista");
    const historialVacio = document.getElementById("historial-vacio");

    function pulsarTecla(tecla) {
      estado = pulsar(estado, tecla);
      pantalla.textContent = estado.pantalla;
      pintarHistorial();
    }

    function pintarHistorial() {
      listaHistorial.replaceChildren(...estado.historial.map(function (operacion) {
        const linea = document.createElement("li");
        linea.textContent = operacion;
        return linea;
      }));
      historialVacio.hidden = estado.historial.length > 0;
    }

    function mostrarHistorial(abrir) {
      historial.hidden = !abrir;
      botonHistorial.setAttribute("aria-expanded", String(abrir));
    }

    botonHistorial.addEventListener("click", function () {
      mostrarHistorial(historial.hidden);
    });
    document.getElementById("cerrar-historial").addEventListener("click", function () {
      mostrarHistorial(false);
    });

    document.querySelectorAll("[data-tecla]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        pulsarTecla(boton.dataset.tecla);
      });
    });

    // Pone los textos en el idioma elegido. No toca la cuenta ni el historial.
    function pintarIdioma() {
      const textos = TEXTOS[idioma];
      document.documentElement.lang = idioma;
      document.querySelectorAll("[data-texto]").forEach(function (elemento) {
        elemento.textContent = textos[elemento.dataset.texto];
      });
      document.querySelectorAll("[data-etiqueta]").forEach(function (elemento) {
        elemento.setAttribute("aria-label", textos[elemento.dataset.etiqueta]);
      });
      document.querySelectorAll("[data-titulo]").forEach(function (elemento) {
        elemento.title = textos[elemento.dataset.titulo];
      });
      document.querySelectorAll("[data-idioma]").forEach(function (boton) {
        boton.setAttribute("aria-pressed", String(boton.dataset.idioma === idioma));
      });
    }

    // Si el navegador no deja guardar (por ejemplo, en la vista previa de la app de Claude),
    // la calculadora funciona igual y simplemente no recuerda el idioma.
    function leerIdiomaGuardado() {
      try { return localStorage.getItem(CLAVE_IDIOMA); } catch { return null; }
    }

    function guardarIdioma() {
      try { localStorage.setItem(CLAVE_IDIOMA, idioma); } catch { /* no se recuerda */ }
    }

    document.querySelectorAll("[data-idioma]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        idioma = boton.dataset.idioma;
        guardarIdioma();
        pintarIdioma();
      });
    });
    pintarIdioma();

    // Teclado del ordenador: hace lo mismo que el botón y lo hunde un momento.
    document.addEventListener("keydown", function (evento) {
      if (evento.ctrlKey || evento.altKey || evento.metaKey) return; // no estorbar atajos como Ctrl + "+"
      const tecla = traducirTecla(evento.key);
      if (tecla === null) return;
      evento.preventDefault(); // evita que Enter pulse además el último botón clicado
      pulsarTecla(tecla);
      const boton = document.querySelector('[data-tecla="' + tecla + '"]');
      boton.classList.add("pulsada");
      setTimeout(function () { boton.classList.remove("pulsada"); }, 120);
    });
  </script>
</body>
</html>
